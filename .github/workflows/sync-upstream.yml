# Periodically merge optional upstream monorepo into this fork (daily).
#
# Happy path (no conflicts):
#   1. merge upstream/main into origin/main
#   2. push main
#   3. call "Build fc" via workflow_call → continuous Release
#
# Why workflow_call (not `gh workflow run`)?
#   GITHUB_TOKEN pushes do not start other workflows, and
#   `gh workflow run "Build fc"` failed here with:
#     could not find any workflows named Build fc
#   Calling the reusable workflow in-process needs no SYNC_PAT.
#
# Conflicts → open/update a GitHub Issue for manual fix.
#
# Optional secret SYNC_PAT: only if you want bot pushes attributed to your
# user; not required for build/release after this change.

name: Sync upstream

on:
  schedule:
    # Once per day at 16:00 UTC (≈ 00:00 China time)
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      auto_merge:
        description: "Push clean merge to main and run Build fc"
        type: boolean
        default: true

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

jobs:
  sync:
    name: Fetch upstream and merge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_build: ${{ steps.flags.outputs.should_build }}
      head: ${{ steps.merge.outputs.head }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add and fetch upstream
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/xai-org/grok-build.git
          git fetch origin main
          git fetch upstream main
          echo "origin/main:  $(git rev-parse origin/main)"
          echo "upstream/main: $(git rev-parse upstream/main)"

      - name: Check whether we are behind upstream
        id: status
        run: |
          set -euo pipefail
          BEHIND=$(git rev-list --count origin/main..upstream/main)
          AHEAD=$(git rev-list --count upstream/main..origin/main)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          echo "Commits on upstream not in origin/main: $BEHIND"
          echo "Commits on origin not in upstream/main: $AHEAD"
          if [ "$BEHIND" -eq 0 ]; then
            echo "already_up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "### Already up to date with upstream" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "already_up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "### Upstream is ahead by $BEHIND commit(s)" >> "$GITHUB_STEP_SUMMARY"
            git log --oneline origin/main..upstream/main | head -30 >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Merge upstream into main
        if: steps.status.outputs.already_up_to_date != 'true'
        id: merge
        run: |
          set -euo pipefail
          git checkout -B main origin/main

          if git merge upstream/main -m "chore: sync from upstream $(date -u +%Y-%m-%d)

          Merge upstream monorepo main into this fork.
          Keep fc branding / install / CI / ~/.fc patches on conflict.
          "; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "Merge clean."
            echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            git merge --abort || true
            echo "Merge has conflicts — needs manual resolution."
            exit 0
          fi

      - name: Push main when clean
        if: >-
          steps.status.outputs.already_up_to_date != 'true'
          && steps.merge.outputs.conflict != 'true'
          && (github.event_name != 'workflow_dispatch' || inputs.auto_merge)
        id: push
        run: |
          set -euo pipefail
          git push origin main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "### Pushed merge to main (\`${{ steps.merge.outputs.head }}\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep sync/upstream branch as mirror (optional audit)
        if: steps.push.outputs.pushed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          git branch -f sync/upstream main
          git push -u origin sync/upstream --force-with-lease || true

      - name: Set should_build flag
        id: flags
        run: |
          if [ "${{ steps.push.outputs.pushed }}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "### Will run **Build fc** via workflow_call" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: File issue when merge conflicts
        if: steps.status.outputs.already_up_to_date != 'true' && steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BEHIND="${{ steps.status.outputs.behind }}"
          TITLE="Upstream sync needs manual merge (${BEHIND} commits)"
          EXISTING=$(gh issue list --state open --search "Upstream sync needs manual merge in:title" --json number --jq '.[0].number // empty')
          BODY="$(cat <<EOF
          Automated **Sync upstream** could not merge \`upstream/main\` cleanly.

          - Behind by **${BEHIND}** commit(s)
          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Manual fix
          \`\`\`sh
          git fetch upstream
          git checkout main
          git pull origin main
          git merge upstream/main
          # resolve conflicts (keep fc branding / install / CI / ~/.fc)
          git push origin main
          \`\`\`

          After push, **Build fc** should refresh the \`continuous\` Release.

          See [FC.md](https://github.com/${{ github.repository }}/blob/main/FC.md).
          EOF
          )"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Commented on issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
          echo "### ⚠️ Conflicts — opened/updated Issue" >> "$GITHUB_STEP_SUMMARY"

  # Same workflow run → no GITHUB_TOKEN cross-workflow dispatch needed.
  build-and-release:
    name: Build fc + continuous
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    uses: ./.github/workflows/build-fc.yml
    permissions:
      contents: write
