# Periodically merge xai-org/grok-build into this fork (daily).
#
# Happy path (no conflicts):
#   1. merge upstream/main into origin/main
#   2. push main
#   3. dispatch "Build kiro" → continuous Release
#
# Conflicts:
#   open (or comment on) a GitHub Issue for manual fix
#
# Optional secret SYNC_PAT:
#   classic PAT (repo + workflow) or fine-grained with contents/PRs/actions.
#   Prefer setting it so pushes are attributed to you and workflow dispatch
#   is reliable. Without it, GITHUB_TOKEN still works for push + dispatch
#   when repo allows Actions write (no branch protection on main).

name: Sync upstream

on:
  schedule:
    # Once per day at 16:00 UTC (≈ 00:00 China time)
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      auto_merge:
        description: "Push clean merge to main and trigger Build kiro"
        type: boolean
        default: true

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

jobs:
  sync:
    name: Fetch upstream and merge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add and fetch upstream
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/xai-org/grok-build.git
          git fetch origin main
          git fetch upstream main
          echo "origin/main:  $(git rev-parse origin/main)"
          echo "upstream/main: $(git rev-parse upstream/main)"

      - name: Check whether we are behind upstream
        id: status
        run: |
          set -euo pipefail
          BEHIND=$(git rev-list --count origin/main..upstream/main)
          AHEAD=$(git rev-list --count upstream/main..origin/main)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          echo "Commits on upstream not in origin/main: $BEHIND"
          echo "Commits on origin not in upstream/main: $AHEAD"
          if [ "$BEHIND" -eq 0 ]; then
            echo "already_up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "### Already up to date with upstream" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "already_up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "### Upstream is ahead by $BEHIND commit(s)" >> "$GITHUB_STEP_SUMMARY"
            git log --oneline origin/main..upstream/main | head -30 >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Merge upstream into main
        if: steps.status.outputs.already_up_to_date != 'true'
        id: merge
        run: |
          set -euo pipefail
          git checkout -B main origin/main

          if git merge upstream/main -m "chore: sync from upstream $(date -u +%Y-%m-%d)

          Merge xai-org/grok-build main into this fork.
          Keep kiro branding / install / CI / ~/.kiro patches on conflict.
          "; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "Merge clean."
            echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            git merge --abort || true
            echo "Merge has conflicts — needs manual resolution."
            # Do not fail the job; the issue step will notify.
            exit 0
          fi

      - name: Push main when clean
        if: >-
          steps.status.outputs.already_up_to_date != 'true'
          && steps.merge.outputs.conflict != 'true'
          && (github.event_name != 'workflow_dispatch' || inputs.auto_merge)
        id: push
        run: |
          set -euo pipefail
          git push origin main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "### Pushed merge to main (\`${{ steps.merge.outputs.head }}\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep sync/upstream branch as mirror (optional audit)
        if: >-
          steps.status.outputs.already_up_to_date != 'true'
          && steps.merge.outputs.conflict != 'true'
          && steps.push.outputs.pushed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          git branch -f sync/upstream main
          git push -u origin sync/upstream --force-with-lease || true

      - name: Trigger Build kiro after clean push
        if: >-
          steps.status.outputs.already_up_to_date != 'true'
          && steps.merge.outputs.conflict != 'true'
          && steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN pushes do not start other workflows; always dispatch.
          # SYNC_PAT pushes also dispatch as a belt-and-suspenders (in case the
          # push event is delayed or filtered).
          sleep 3
          if gh workflow run "Build kiro" --ref main; then
            echo "Dispatched Build kiro on main"
            echo "### Dispatched **Build kiro**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Failed to dispatch Build kiro — check Actions permissions / SYNC_PAT"
            exit 1
          fi

      - name: File issue when merge conflicts
        if: steps.status.outputs.already_up_to_date != 'true' && steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BEHIND="${{ steps.status.outputs.behind }}"
          TITLE="Upstream sync needs manual merge (${BEHIND} commits)"
          EXISTING=$(gh issue list --state open --search "Upstream sync needs manual merge in:title" --json number --jq '.[0].number // empty')
          BODY="$(cat <<EOF
          Automated **Sync upstream** could not merge \`upstream/main\` cleanly.

          - Behind by **${BEHIND}** commit(s)
          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Manual fix
          \`\`\`sh
          git fetch upstream
          git checkout main
          git pull origin main
          git merge upstream/main
          # resolve conflicts (keep kiro branding / install / CI / ~/.kiro)
          git push origin main
          \`\`\`

          After push, **Build kiro** should refresh the \`continuous\` Release.

          See [KIRO.md](https://github.com/${{ github.repository }}/blob/main/KIRO.md).
          EOF
          )"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Commented on issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
          echo "### ⚠️ Conflicts — opened/updated Issue" >> "$GITHUB_STEP_SUMMARY"
